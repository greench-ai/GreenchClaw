# Verifies install.sh / install-cli.sh / install.ps1 on Linux (Docker), macOS and Windows.
# The old OpenClaw-era step that mirrored the scripts into the upstream site/docs repositories was
# removed: those repositories do not exist under this account, so the job could only ever fail
# with "Input required and not supplied: token". Verification is the whole job now.
name: Website Installer Sync

on:
  pull_request:
    paths:
      - scripts/install.sh
      - scripts/install-cli.sh
      - scripts/install.ps1
      - .github/workflows/website-installer-sync.yml
  push:
    branches: [main]
    paths:
      - scripts/install.sh
      - scripts/install-cli.sh
      - scripts/install.ps1
      - .github/workflows/website-installer-sync.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-installer-sync-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install ShellCheck
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck

      - name: Shell syntax
        run: bash -n scripts/install.sh scripts/install-cli.sh

      - name: ShellCheck
        run: shellcheck -e SC1091 scripts/install.sh scripts/install-cli.sh

      - name: Installer help and dry-runs
        run: |
          bash scripts/install.sh --help >/tmp/install-help.txt
          bash scripts/install.sh --dry-run --no-onboard --no-prompt
          bash scripts/install-cli.sh --help >/tmp/install-cli-help.txt

      - name: PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.PSParser]::Tokenize(
            (Get-Content -Raw scripts/install.ps1),
            [ref]$errors
          )
          if ($errors -and $errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

  linux-docker:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: install.sh in Docker
        run: |
          docker run --rm \
            -e GREENCHCLAW_NO_ONBOARD=1 \
            -e GREENCHCLAW_NO_PROMPT=1 \
            -v "$PWD/scripts/install.sh:/tmp/install.sh:ro" \
            node:24-bookworm-slim \
            bash -lc 'bash /tmp/install.sh --no-prompt --no-onboard --version latest && GreenchClaw --version'

      - name: install-cli.sh in Docker
        run: |
          docker run --rm \
            -e GREENCHCLAW_NO_ONBOARD=1 \
            -e GREENCHCLAW_NO_PROMPT=1 \
            -v "$PWD/scripts/install-cli.sh:/tmp/install-cli.sh:ro" \
            node:24-bookworm-slim \
            bash -lc 'apt-get update -y && apt-get install -y curl && bash /tmp/install-cli.sh --prefix /tmp/GreenchClaw --no-onboard --version latest && /tmp/GreenchClaw/bin/GreenchClaw --version'

  macos-installer:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: install.sh dry run
        run: bash scripts/install.sh --dry-run --no-onboard --no-prompt

      - name: install.sh on macOS
        env:
          GREENCHCLAW_NO_ONBOARD: "1"
          GREENCHCLAW_NO_PROMPT: "1"
        run: |
          bash scripts/install.sh --no-onboard --no-prompt --version latest
          GreenchClaw --version

  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: install.ps1 dry run
        shell: pwsh
        run: .\scripts\install.ps1 -DryRun -NoOnboard -InstallMethod npm
