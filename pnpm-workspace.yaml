packages:
  - .
  - ui
  - packages/*
  - extensions/*

blockExoticSubdeps: false

minimumReleaseAge: 0

minimumReleaseAgeExclude:
  - "acpx"
  - "tokenjuice"
  - "@agentclientprotocol/sdk"
  - "axios"
  - "basic-ftp"
  - "hono"
  - "GreenchClaw"
  - "protobufjs"
  - "vite"
  - "@cloudflare/workers-types"
  - "@hono/node-server"
  - "@mariozechner/*"
  - "@openai/codex"
  - "@openai/codex-*"
  - "@typescript/native-preview*"
  - "@types/node"
  - "@rolldown/*"
  - "@oxlint/*"
  - "@oxfmt/*"
  - "oxfmt"
  - "axios@1.15.0"
  - "@vitest/coverage-v8"
  - "discord-api-types"
  - "rolldown"
  - "sqlite-vec"
  - "sqlite-vec-*"

nodeLinker: hoisted

overrides:
  "@anthropic-ai/sdk": 0.95.1
  "@grpc/grpc-js": ^1.14.6
  "@modelcontextprotocol/sdk": ^1.32.1
  "@opentelemetry/propagator-jaeger": ^2.12.0
  hono: ^4.13.13
  "@hono/node-server": 1.19.14
  "@aws-sdk/client-bedrock-runtime": 3.1045.0
  axios: ^1.20.0
  basic-ftp: ^6.2.1
  brace-expansion: ^5.0.12
  dompurify: ^3.4.17
  extract-zip: ^2.0.1
  fast-uri: ^3.1.8
  follow-redirects: ^1.16.1
  defu: 6.1.5
  fast-xml-parser: 5.7.0
  request: "npm:@cypress/request@3.0.10"
  request-promise: "npm:@cypress/request-promise@5.0.0"
  file-type: 22.0.1
  form-data: ^2.5.6
  ip-address: ^10.7.4
  markdown-it: ^14.3.3
  minimatch: 10.2.5
  music-metadata: ^11.16.0
  path-to-regexp: 8.4.0
  protobufjs: ^7.6.6
  proxy-addr: ^2.0.8
  qs: ^6.16.1
  sharp: ^0.35.5
  source-map-js: ^1.2.2
  node-domexception: "npm:@nolyfill/domexception@1.0.28"
  typebox: 1.1.38
  tar: ^7.5.22
  tough-cookie: 4.1.3
  # jsdom 29.1.1 still require()s undici's CommonJS internals
  # (`undici/lib/handler/wrap-handler.js`). undici 8 removed those paths and has no CJS
  # entry, which crashes every jsdom-backed UI test worker at startup. Keep jsdom on 7.x.
  "jsdom>undici": ^7.25.0
  undici: ^8.12.3
  vite: ^8.3.5
  vitest: ^4.1.12
  ws: ^8.22.0
  yauzl: 3.2.1
  uuid: 14.0.0

  "@azure/msal-node": ^7.1.1
  "body-parser": ^2.4.0
  "zod": ^4.6.7
allowBuilds:
  "@GreenchClaw/fs-safe": true
  "@google/genai": true
  "@lydell/node-pty": true
  "@matrix-org/matrix-sdk-crypto-nodejs": true
  "@napi-rs/canvas": true
  "@tloncorp/api": true
  "@tloncorp/tlon-skill": true
  baileys: true
  "@whiskeysockets/libsignal-node": true
  authenticate-pam: true
  "@discordjs/opus": false
  esbuild: true
  koffi: false
  node-llama-cpp: true
  protobufjs: true
  sharp: true
  tree-sitter-bash: false
  GreenchClaw: true

packageExtensions:
  "@earendil-works/pi-coding-agent":
    dependencies:
      strip-ansi: 7.2.0

peerDependencyRules:
  allowedVersions:
    "prism-media>opusscript": "^0.0.8 || ^0.1.1"

patchedDependencies:
  "baileys@7.0.0-rc14": "patches/baileys@7.0.0-rc14.patch"
  "@agentclientprotocol/claude-agent-acp@0.33.1": "patches/@agentclientprotocol__claude-agent-acp@0.33.1.patch"
